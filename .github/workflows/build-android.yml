name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile (preview or development)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - development

jobs:
  build:
    name: Build APK (${{ github.event.inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build APK locally on runner
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --local \
            --platform android \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive \
            --output ./build-output.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-android-${{ github.event.inputs.profile }}
          path: ./build-output.apk
          retention-days: 30
